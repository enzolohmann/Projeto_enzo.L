<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elementos "range" e "search"</title>
</head>
<body>
    <h1>Formulario Exemplo search e range</h1>
    <p>Para essas funções utilizaremos como exemplo um terminal de configuração de um fone de ouvido</p>
    <br>
    <h2>Abaixo estão algumas configurações, arraste a barra para o volume desejado</h2>
    <br>
    <label for="ouvidoesq">ouvido esquerdo (de 0 a 100)</label>
    <input type="range" id="ouvidoesq" name="ouvidoesq" min="0" max="100" value="0">
    <br>
    <br>
    <label for="ouvidodir">ouvido direito (de 0 a 100)</label>
    <input type="range" id="ouvidodir" name="ouvidodir" min="0" max="100" value="0">
    <br>
    <br>
    <h2>Se deseja buscar outra configuração especifica digite na bara de pesquisa Abaixo</h2>
    <search>
        <input name="peaquisa" id="pesquisa" placeholder="pesquisa">
    </search>
</body>
</html>
